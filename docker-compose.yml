# Jandi MovieHub — full local stack.
#   docker compose up -d postgres redis mailpit          # infrastructure only (run apps with pnpm dev)
#   docker compose --profile app up -d --build           # everything behind nginx on http://localhost:8080
# Secrets come from .env next to this file (see .env.example). Never commit real values.
name: jandi-moviehub

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jandi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jandi_dev_password}
      POSTGRES_DB: jandi_moviehub
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jandi -d jandi_moviehub']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: ['redisdata:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ['8025:8025', '1025:1025']

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ['s3']
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-jandi}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-jandi-dev-secret}
    ports: ['9000:9000', '9001:9001']
    volumes: ['miniodata:/data']

  api-migrate:
    profiles: ['app']
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile, target: migrate }
    environment:
      DATABASE_URL: postgresql://jandi:${POSTGRES_PASSWORD:-jandi_dev_password}@postgres:5432/jandi_moviehub
    depends_on: { postgres: { condition: service_healthy } }

  api:
    profiles: ['app']
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile, target: runtime }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://jandi:${POSTGRES_PASSWORD:-jandi_dev_password}@postgres:5432/jandi_moviehub
      REDIS_URL: redis://redis:6379/0
      WEB_ORIGINS: ${PUBLIC_URL:-http://localhost:8080}
      PUBLIC_WEB_URL: ${PUBLIC_URL:-http://localhost:8080}
      PUBLIC_API_URL: ${PUBLIC_URL:-http://localhost:8080}
      TRUST_PROXY: 'true'
      # Required in production. Browsers accept Secure cookies on http://localhost, so this works locally too.
      COOKIE_SECURE: 'true'
      # Validated by the API at startup; an empty value still allows infrastructure-only use.
      MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:-}
      MAIL_TRANSPORT: smtp
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
      MAIL_FROM: ${MAIL_FROM:-Jandi MovieHub <no-reply@jandi.local>}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /data/storage
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      TMDB_READ_TOKEN: ${TMDB_READ_TOKEN:-}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    volumes: ['./storage:/data/storage']
    depends_on:
      api-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    profiles: ['app']
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
        NEXT_PUBLIC_WS_URL: ${PUBLIC_URL:-http://localhost:8080}
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on: [api]

  proxy:
    profiles: ['app']
    image: nginx:1.27-alpine
    ports: ['8080:80']
    volumes: ['./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on: [web, api]

volumes:
  pgdata:
  redisdata:
  miniodata:
