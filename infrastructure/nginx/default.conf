# Reverse proxy: one origin for web, REST and WebSockets (so the session cookie is first-party).
# Terminate TLS in front of this (or add `listen 443 ssl` + certificates) in production.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream jandi_web { server web:3000; }
upstream jandi_api { server api:4000; }

server {
  listen 80;
  server_name _;
  client_max_body_size 600m;   # admin media uploads

  location /socket.io/ {
    proxy_pass http://jandi_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location /api/ {
    proxy_pass http://jandi_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;          # stream media ranges straight through
  }

  location / {
    proxy_pass http://jandi_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
