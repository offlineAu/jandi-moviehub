name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jandi
          POSTGRES_PASSWORD: jandi_dev_password
          POSTGRES_DB: jandi_moviehub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jandi" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://jandi:jandi_dev_password@localhost:5432/jandi_moviehub
      REDIS_URL: redis://localhost:6379/0
      MEDIA_SIGNING_SECRET: ci-only-media-signing-secret-not-for-production-use
      ENABLE_DEV_ROUTES: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile

      - name: Prepare env files
        run: |
          cp apps/api/.env.example apps/api/.env
          sed -i "s|^MEDIA_SIGNING_SECRET=.*|MEDIA_SIGNING_SECRET=$MEDIA_SIGNING_SECRET|" apps/api/.env
          sed -e 's|jandi_moviehub$|jandi_moviehub_test|' -e 's|^NODE_ENV=.*|NODE_ENV=test|' -e 's|^LOG_LEVEL=.*|LOG_LEVEL=silent|' -e 's|^STORAGE_LOCAL_DIR=.*|STORAGE_LOCAL_DIR=../../.data/test-storage|' apps/api/.env > apps/api/.env.test
          echo "HOST_RECONNECT_GRACE_SEC=1" >> apps/api/.env.test
          psql postgresql://jandi:jandi_dev_password@localhost:5432/postgres -c 'CREATE DATABASE jandi_moviehub_test'
          psql postgresql://jandi:jandi_dev_password@localhost:5432/postgres -c 'CREATE DATABASE jandi_moviehub_e2e'
          cp apps/web/.env.example apps/web/.env.local || true

      - run: pnpm --filter @jandi/shared build
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Integration tests (API, real Postgres + Redis)
        run: pnpm test:integration
      - name: Production build
        run: pnpm build
      - name: Dependency audit (high+)
        run: pnpm audit --prod --audit-level high

      - name: Prepare E2E environment
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm media:generate
          pnpm db:deploy
          pnpm db:seed
      - name: End-to-end tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  docker:
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        run: docker build -f infrastructure/docker/api.Dockerfile --target runtime -t jandi-api:ci .
      - name: Build web image
        run: docker build -f infrastructure/docker/web.Dockerfile -t jandi-web:ci .
